name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate servers
        run: |
          test -f README.md && test -f LICENSE && test -d servers
          count=$(find servers -name "*.md" | wc -l)
          echo "Found $count server files"
          [ "$count" -ge 5 ] || (echo "Expected at least 5 servers" && exit 1)
          echo "All checks passed!"
