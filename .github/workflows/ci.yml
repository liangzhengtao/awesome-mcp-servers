name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint all markdown files
        run: markdownlint '**/*.md' --ignore node_modules

  structure:
    name: Validate Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          required_files=(
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "CHANGELOG.md"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file '$file' is missing"
              exit 1
            fi
            echo "OK: $file exists"
          done

      - name: Check all servers are listed in README
        run: |
          for server_file in servers/*.md; do
            server_name=$(basename "$server_file" .md)
            if ! grep -q "$server_name" README.md; then
              echo "WARNING: Server '$server_name' exists in servers/ but is not listed in README.md"
            else
              echo "OK: $server_name is listed in README.md"
            fi
          done

      - name: Check server files have required sections
        run: |
          for server_file in servers/*.md; do
            server_name=$(basename "$server_file" .md)
            echo "Checking $server_name..."

            required_sections=("What It Does" "Quick Setup" "What You Can Do" "Requirements" "Links")
            for section in "${required_sections[@]}"; do
              if ! grep -q "## $section" "$server_file"; then
                echo "  WARNING: Missing section '## $section' in $server_file"
              else
                echo "  OK: Has '## $section'"
              fi
            done
          done

      - name: Check server files have version annotations
        run: |
          for server_file in servers/*.md; do
            server_name=$(basename "$server_file" .md)
            if ! grep -q "Last updated:" "$server_file"; then
              echo "WARNING: '$server_name' is missing 'Last updated:' annotation"
            else
              echo "OK: $server_name has version annotation"
            fi
          done

  links:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check internal links
        run: |
          # Extract markdown links and verify internal targets exist
          grep -roh '\[.*\](.*\.md)' *.md servers/*.md by-category/*.md 2>/dev/null | while read -r link; do
            target=$(echo "$link" | sed 's/.*](\(.*\))/\1/' | sed 's/#.*//')
            if [ -z "$target" ]; then
              continue
            fi

            # Skip external URLs
            if echo "$target" | grep -q '^http'; then
              continue
            fi

            # Resolve relative to the repo root
            if [ ! -f "$target" ]; then
              echo "WARNING: Broken internal link: $target"
            else
              echo "OK: $target"
            fi
          done
